[project]
name = "ces-revisions"
version = "0.1.0"
description = "Bayesian state-space analysis of the magnitude of U.S. CES payroll employment revisions"
readme = "README.md"
authors = [
    { name = "Lowell Mason", email = "mason.lowell@mac.com" }
]
requires-python = ">=3.14"
dependencies = [
    "arviz>=1.3.0",
    "fastexcel>=0.21.0",
    "jax>=0.11.1",
    "numpy>=2.5.3",
    "numpyro>=0.21.0",
    "polars>=1.44.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# JAX's CUDA 13 plugin for the cloud GPU sizes. Linux-only, so the Mac's
# `uv sync --extra cuda` installs nothing new.
cuda = ["jax[cuda13]>=0.11.1; sys_platform == 'linux'"]

[project.scripts]
ces-revisions = "ces_revisions:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dynamax>=1.0.2",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.uv]
# The Mac and the cloud VM run one uv series, so uv.lock is written one way.
required-version = "~=0.12.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
# scripts/ holds research tools that tests import by bare name, like the helpers in tests/.
pythonpath = ["scripts"]
# An unregistered (e.g. misspelled) marker fails collection instead of silently escaping `-m` filters.
filterwarnings = ["error::pytest.PytestUnknownMarkWarning"]
markers = [
    "network: hits the network (live BLS fetch or layout canary); deselect with -m 'not network'",
    "slow: MCMC or end-to-end runs taking seconds to minutes; deselect with -m 'not slow'",
]

[tool.ruff.lint]
# Enable every isort (I), flake8-bugbear (B), and pyupgrade (UP) rule on top of ruff's
# default rule set; `select` would replace the defaults instead of extending them.
extend-select = ["I", "B", "UP"]
